    let map;

    function initMap() {

      map = new google.maps.Map(
        document.getElementById("map"),
        {
          center: {
            lat: 23.9764,
            lng: 87.9965
          },
          zoom: 16,
          mapTypeId: "satellite",
          mapTypeControl: true,
          streetViewControl: true,
          fullscreenControl: true
        }
      );

      const bounds = new google.maps.LatLngBounds();

      // Draw Polygon
      new google.maps.Polygon({
        paths: polygonCoordinates,
        strokeColor: "#FF0000",
        strokeOpacity: 1,
        strokeWeight: 3,
        fillColor: "#FF0000",
        fillOpacity: 1,
        map: map
      });

      // Add 24 Polygon Point Markers
      polygonCoordinates.forEach((point, index) => {

        bounds.extend(point);

        const marker = new google.maps.Marker({
          position: point,
          map: map,
          title: `Polygon Point ${index + 1}`,
          label: {
            text: String(index + 1),
            color: "#FFFFFF",
            fontSize: "10px"
          },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 6,
            fillColor: "#1976D2",
            fillOpacity: 1,
            strokeColor: "#FFFFFF",
            strokeWeight: 2
          }
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `
                        <div>
                            <b>Polygon Point ${index + 1}</b><br>
                            Latitude: ${point.lat}<br>
                            Longitude: ${point.lng}
                        </div>
                    `
        });

        marker.addListener("click", () => {
          infoWindow.open({
            map: map,
            anchor: marker
          });
        });

      });

      // Add 3 AWD Pipe Installation Markers
      pipeLocations.forEach((location, index) => {

        const position = {
          lat: location.latitude,
          lng: location.longitude
        };

        bounds.extend(position);

        const marker = new google.maps.Marker({
          position: position,
          map: map,
          title: location.name,
          label: {
            text: `P${index + 1}`,
            color: "#000000",
            fontWeight: "bold",
            fontSize: "11px"
          },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: location.color,
            fillOpacity: 1,
            strokeColor: "#FFFFFF",
            strokeWeight: 2
          },
          zIndex: 100
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `
                        <div style="min-width:200px">
                            <h3 style="margin:0 0 8px;color:#b8860b">
                                AWD Pipe Installation
                            </h3>
                            <b>${location.name}</b>
                            <hr>
                            Latitude: ${location.latitude}<br>
                            Longitude: ${location.longitude}
                        </div>
                    `
        });

        marker.addListener("click", () => {
          infoWindow.open({
            map: map,
            anchor: marker
          });
        });

      });

      // Fit all polygon points and pipe markers
      map.fitBounds(bounds);
